# Один workflow перевіряє той самий commit на трьох операційних системах.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Однаковий JDK 21 і кеш Maven-залежностей (~/.m2) між запусками.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show CI build number
        run: echo "CI build ${{ github.run_number }}"

      # verify = компіляція -> тести -> package (shade JAR) -> SpotBugs.
      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify -DbuildNumber=${{ github.run_number }}

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify "-DbuildNumber=${{ github.run_number }}"

      # Димовий запуск зібраного JAR на кожній ОС.
      - name: Run JAR
        shell: bash
        run: |
          java -jar target/lab01-1.0.0.jar --version
          java -jar target/lab01-1.0.0.jar --input data/input.csv --output out/report.txt

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lab01-1.0.0-${{ matrix.os }}-build${{ github.run_number }}
          path: target/lab01-1.0.0.jar
          if-no-files-found: error
